<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>布局测量（0.1.1 单列 + 悬浮栏）</title></head>
<body>
  <pre id="out">测量中…</pre>
  <script>
    (function () {
      var w = parseInt((location.search.match(/[?&]w=(\d+)/) || [])[1], 10) || 1180;
      var h = parseInt((location.search.match(/[?&]h=(\d+)/) || [])[1], 10) || 820;
      var iframe = document.createElement('iframe');
      iframe.style.width = w + 'px';
      iframe.style.height = h + 'px';
      iframe.style.border = '0';
      iframe.src = '../index.html';
      document.body.appendChild(iframe);

      iframe.onload = function () {
        setTimeout(function () {
          try {
            var doc = iframe.contentDocument;
            var out = [];
            out.push('viewport=' + w + 'x' + h);

            var content = doc.querySelector('.content').getBoundingClientRect();
            out.push('content: left=' + Math.round(content.left) + ' w=' + Math.round(content.width));
            var centered = Math.abs((w - content.width) / 2 - content.left) < 8;
            out.push('contentCentered=' + centered);

            // 卡片纵向顺序：题目 → 编辑器 → 数据表 → 结果
            var task = doc.querySelector('.task-card').getBoundingClientRect();
            var editor = doc.querySelector('.editor-card').getBoundingClientRect();
            var schema = doc.querySelector('.schema-card').getBoundingClientRect();
            var result = doc.querySelector('.result-card').getBoundingClientRect();
            out.push('order: task.top=' + Math.round(task.top) + ' editor.top=' + Math.round(editor.top) +
              ' schema.top=' + Math.round(schema.top) + ' result.top=' + Math.round(result.top));
            var orderOk = task.top < editor.top && editor.top < schema.top && schema.top < result.top;
            out.push('orderOk=' + orderOk);

            // 数据表默认折叠
            var collapsed = doc.getElementById('schemaBody').classList.contains('hidden');
            out.push('schemaCollapsedDefault=' + collapsed);

            // 悬浮栏
            var fb = doc.getElementById('floatingBar').getBoundingClientRect();
            out.push('floatingBar: bottom=' + Math.round(fb.bottom) + ' viewportH=' + h);
            var fbOk = (h - fb.bottom) < 40;
            out.push('floatingBarAtBottom=' + fbOk);

            var ok = centered && orderOk && collapsed && fbOk;
            out.push('RESULT=' + (ok ? 'LAYOUT_OK' : 'LAYOUT_FAIL'));
            document.getElementById('out').textContent = out.join('\n');
          } catch (e) {
            document.getElementById('out').textContent = '测量异常: ' + e.message;
          }
        }, 2500);
      };
    })();
  </script>
</body>
</html>
